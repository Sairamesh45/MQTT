# ACL rules for MQTT broker

# Backend service account - can subscribe and publish to all collar topics
user mqtt_backend_service
topic read collar/#
topic write collar/#

# Device pattern - each device can only publish to their own topics
# Devices must use their IMEI as username
pattern read collar/%u/isOn
pattern read collar/%u/isWalking
pattern write collar/%u/location
pattern write collar/%u/battery
